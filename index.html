<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>좀비 시티 탈출</title>
<style>
:root{color-scheme:dark;--fg:#e9edf2;--mut:#9aa5b1;--bad:#d8402f;--st:#e2b93b;--bg:#12161b}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#vg{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(190,20,10,.75) 100%)}
.bars{position:fixed;left:calc(env(safe-area-inset-left,0px) + 16px);top:calc(env(safe-area-inset-top,0px) + 16px);width:200px}
.bar{height:10px;background:rgba(255,255,255,.14);margin-bottom:6px}
.bar i{display:block;height:100%;width:100%;background:var(--bad)}
.bar.s i{background:var(--st)}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 1px 4px #000}
.top b{display:block;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.top span{color:var(--mut);font-size:14px}
#mm{position:fixed;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:140px;height:140px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(10,12,16,.6)}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,13,.82);padding:20px}
.card{max-width:420px;text-align:left}
.card h1{margin:0 0 12px;font-size:34px;line-height:1.15}
.card p{margin:0 0 20px;color:var(--mut);line-height:1.65;font-size:15px}
.card p b{color:var(--fg);font-weight:600}
button{font:inherit;font-weight:700;font-size:16px;color:#fff;background:var(--bad);border:0;padding:12px 28px;cursor:pointer}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vg"></div>
<div class="bars"><div class="bar"><i id="hp"></i></div><div class="bar s"><i id="sp"></i></div></div>
<div class="top"><b id="tm">00:00</b><span id="zc">좀비 0마리</span></div>
<canvas id="mm" width="140" height="140"></canvas>
<div id="ov"><div class="card">
<h1 id="ovt">좀비 시티 탈출</h1>
<p id="ovm">3.2km × 3.2km 도시에 좀비가 1초에 한 마리씩 나타납니다. 잡히면 체력이 닳고 회복되지 않으며, 0이 되면 끝납니다. 달리기는 스태미나가 있을 때만 할 수 있습니다.<br><br><b>W A S D</b> 이동 · <b>Shift</b> 달리기 · <b>Space</b> 점프<br><b>마우스</b> 시점 (잠금이 안 되면 드래그, 또는 방향키) · <b>Esc</b> 일시정지</p>
<button id="go">시작하기</button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20261121);

const cv=$('c');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
const FOG=0x1a2028;
const scene=new THREE.Scene();
scene.background=new THREE.Color(FOG);
scene.fog=new THREE.Fog(FOG,15,240);
const camera=new THREE.PerspectiveCamera(75,1,0.1,400);
camera.rotation.order='YXZ';
scene.add(camera);
const flash=new THREE.PointLight(0xfff0c8,0.9,28);
camera.add(flash);
scene.add(new THREE.HemisphereLight(0x8fa3bd,0x20242a,0.95));
const sun=new THREE.DirectionalLight(0xaab6d0,0.45);sun.position.set(-1,2,.5);scene.add(sun);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ---------- 도시 ---------- */
const N=40,CELL=80,OX=-N*CELL/2,OZ=OX,BOUND=N*CELL/2-4;
const fc=document.createElement('canvas'),ec=document.createElement('canvas');
fc.width=fc.height=ec.width=ec.height=256;
const fx=fc.getContext('2d'),ex=ec.getContext('2d');
fx.fillStyle='#8c9199';fx.fillRect(0,0,256,256);ex.fillStyle='#000';ex.fillRect(0,0,256,256);
for(let y=0;y<8;y++)for(let x=0;x<8;x++){
  const lit=R()<0.22;
  fx.fillStyle=lit?'#e8d9a0':'#1d2733';fx.fillRect(x*32+8,y*32+8,16,16);
  if(lit){ex.fillStyle='#ffd88a';ex.fillRect(x*32+8,y*32+8,16,16)}
}
function tex(c){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t}
const fTex=tex(fc),eTex=tex(ec);

const P=[],NR=[],UV=[],CO=[],IX=[];let vc=0;
function quad(a,b,c,d,n,L,H,cl){
  for(const v of [a,b,c,d]){P.push(v[0],v[1],v[2]);NR.push(n[0],n[1],n[2]);CO.push(cl.r,cl.g,cl.b)}
  if(L<0)UV.push(.02,.02,.02,.02,.02,.02,.02,.02);else UV.push(0,0,L,0,L,H,0,H);
  IX.push(vc,vc+1,vc+2,vc,vc+2,vc+3);vc+=4;
}
function box(x0,z0,x1,z1,h,cl){
  const w=(x1-x0)/32,d=(z1-z0)/32,v=h/32;
  quad([x0,0,z1],[x1,0,z1],[x1,h,z1],[x0,h,z1],[0,0,1],w,v,cl);
  quad([x1,0,z0],[x0,0,z0],[x0,h,z0],[x1,h,z0],[0,0,-1],w,v,cl);
  quad([x1,0,z1],[x1,0,z0],[x1,h,z0],[x1,h,z1],[1,0,0],d,v,cl);
  quad([x0,0,z0],[x0,0,z1],[x0,h,z1],[x0,h,z0],[-1,0,0],d,v,cl);
  quad([x0,h,z1],[x1,h,z1],[x1,h,z0],[x0,h,z0],[0,1,0],-1,0,cl);
}
const cells=[];
for(let j=0;j<N;j++)for(let i=0;i<N;i++){
  const rs=[];cells.push(rs);
  const bx=OX+i*CELL+10,bz=OZ+j*CELL+10;
  const cd=Math.hypot(i-N/2,j-N/2)/(N/2);
  for(let a=0;a<2;a++)for(let b=0;b<2;b++){
    if(R()<0.1)continue;
    const w=15+R()*12,d=15+R()*12;
    const x0=bx+a*33+(27-w)/2,z0=bz+b*33+(27-d)/2;
    const h=8+R()*22+Math.pow(R(),2)*90*Math.max(0,1-cd);
    rs.push([x0,z0,x0+w,z0+d,h]);
    const cl=new THREE.Color();
    if(R()<0.2)cl.setHSL(0.04,0.3,0.3+R()*0.1);else cl.setHSL(0.55+R()*0.15,0.08+R()*0.15,0.3+R()*0.3);
    box(x0,z0,x0+w,z0+d,h,cl);
  }
}
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
geo.setAttribute('normal',new THREE.Float32BufferAttribute(NR,3));
geo.setAttribute('uv',new THREE.Float32BufferAttribute(UV,2));
geo.setAttribute('color',new THREE.Float32BufferAttribute(CO,3));
geo.setIndex(IX);
scene.add(new THREE.Mesh(geo,new THREE.MeshLambertMaterial({map:fTex,emissiveMap:eTex,emissive:0xffffff,emissiveIntensity:0.9,vertexColors:true})));

const gc=document.createElement('canvas');gc.width=gc.height=256;
const g=gc.getContext('2d');
g.fillStyle='#23262b';g.fillRect(0,0,256,256);
g.fillStyle='#50545b';g.fillRect(32,32,192,192);
g.strokeStyle='#7a7f87';g.lineWidth=3;g.strokeRect(32,32,192,192);
g.fillStyle='#d9b83a';
for(let k=40;k<224;k+=32){g.fillRect(-1.5,k,3,16);g.fillRect(254.5,k,3,16);g.fillRect(k,-1.5,16,3);g.fillRect(k,254.5,16,3)}
const gTex=tex(gc);gTex.repeat.set(N,N);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(N*CELL,N*CELL),new THREE.MeshLambertMaterial({map:gTex}));
ground.rotation.x=-Math.PI/2;scene.add(ground);

function inB(x,z,m){
  if(x<OX||z<OZ||x>=-OX||z>=-OZ)return true;
  const i=((x-OX)/CELL)|0,j=((z-OZ)/CELL)|0;
  for(const b of cells[j*N+i])if(x>b[0]-m&&x<b[2]+m&&z>b[1]-m&&z<b[3]+m)return true;
  return false;
}
function collide(o,r){
  const x=Math.max(OX+3,Math.min(-OX-3,o.x)),z=Math.max(OZ+3,Math.min(-OZ-3,o.z));o.x=x;o.z=z;
  const i=((x-OX)/CELL)|0,j=((z-OZ)/CELL)|0;
  for(const b of cells[j*N+i]){
    const cx=Math.max(b[0],Math.min(o.x,b[2])),cz=Math.max(b[1],Math.min(o.z,b[3]));
    const dx=o.x-cx,dz=o.z-cz,d2=dx*dx+dz*dz;
    if(d2<r*r){
      if(d2>1e-6){const d=Math.sqrt(d2);o.x=cx+dx/d*r;o.z=cz+dz/d*r}
      else{
        const l=o.x-b[0],rr=b[2]-o.x,t=o.z-b[1],bt=b[3]-o.z,m=Math.min(l,rr,t,bt);
        if(m===l)o.x=b[0]-r;else if(m===rr)o.x=b[2]+r;else if(m===t)o.z=b[1]-r;else o.z=b[3]+r;
      }
    }
  }
}

/* ---------- 좀비 (인스턴싱) ---------- */
const MAX=5000;
const zmat=new THREE.MeshLambertMaterial({color:0xffffff});
function im(w,h,d,n){
  const m=new THREE.InstancedMesh(new THREE.BoxGeometry(w,h,d),zmat,n);
  m.frustumCulled=false;m.count=0;m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.setColorAt(0,new THREE.Color(1,1,1));scene.add(m);return m;
}
const body=im(.55,.75,.3,MAX),head=im(.32,.32,.32,MAX),legs=im(.22,.8,.25,MAX*2),arms=im(.14,.14,.7,MAX*2);
const D=new THREE.Object3D();D.rotation.order='YXZ';
function put(m,idx,z,lx,ly,lz,rx,c){
  const cs=Math.cos(z.yaw),sn=Math.sin(z.yaw);
  D.position.set(z.x+lx*cs+lz*sn,ly,z.z-lx*sn+lz*cs);
  D.rotation.set(rx,z.yaw,0);D.updateMatrix();
  m.setMatrixAt(idx,D.matrix);m.setColorAt(idx,c);
}
function drawZ(){
  const n=zs.length;
  for(let i=0;i<n;i++){
    const z=zs[i],bob=Math.abs(Math.sin(z.ph))*0.06,sw=Math.sin(z.ph)*0.5;
    put(body,i,z,0,1.2+bob,0,0,z.shirt);
    put(head,i,z,0,1.78+bob,-0.03,0,z.skin);
    put(legs,2*i,z,-0.14,0.4,0,sw,z.pants);
    put(legs,2*i+1,z,0.14,0.4,0,-sw,z.pants);
    put(arms,2*i,z,-0.3,1.45+bob,-0.35,-0.1,z.skin);
    put(arms,2*i+1,z,0.3,1.45+bob,-0.35,-0.1,z.skin);
  }
  body.count=head.count=n;legs.count=arms.count=2*n;
  for(const m of [body,head,legs,arms]){m.instanceMatrix.needsUpdate=true;m.instanceColor.needsUpdate=true}
}

/* ---------- 상태 ---------- */
const pl={x:0,z:0};
let yaw=0,pitch=0,py=0,vy=0,hp=100,st=100,tired=false,t=0,spawnT=0,bobT=0,total=0,hurt=0;
let zs=[],running=false,over=false,started=false,locked=false,drag=false;
const keys={};
function reset(){pl.x=0;pl.z=0;yaw=0;pitch=0;py=0;vy=0;hp=100;st=100;tired=false;t=0;spawnT=0;total=0;hurt=0;zs=[];drawZ()}

function spawn(){
  for(let k=0;k<12;k++){
    const a=Math.random()*6.283,r=45+Math.random()*40;
    const x=pl.x+Math.cos(a)*r,z=pl.z+Math.sin(a)*r;
    if(inB(x,z,0.8))continue;
    if(zs.length>=MAX)return;
    const run=Math.random()<0.12;
    zs.push({x,z,yaw:0,ph:Math.random()*6,spd:run?5.8+Math.random():2.5+Math.random()*2.5,
      skin:new THREE.Color().setHSL(0.22+Math.random()*0.1,0.35,0.3+Math.random()*0.15),
      shirt:new THREE.Color().setHSL(Math.random(),0.25,0.18+Math.random()*0.15),
      pants:new THREE.Color().setHSL(0.6,0.2,0.12+Math.random()*0.08)});
    total++;return;
  }
}

function fmt(s){s|=0;return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

function update(dt){
  if(keys.ArrowLeft)yaw+=1.9*dt;if(keys.ArrowRight)yaw-=1.9*dt;
  if(keys.ArrowUp)pitch+=1.5*dt;if(keys.ArrowDown)pitch-=1.5*dt;
  pitch=Math.max(-1.45,Math.min(1.45,pitch));
  const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  const moving=f||s;
  const sprint=moving&&(keys.ShiftLeft||keys.ShiftRight)&&!tired&&st>0;
  if(sprint){st-=28*dt;if(st<=0){st=0;tired=true}}else{st=Math.min(100,st+14*dt);if(st>25)tired=false}
  if(moving){
    const l=Math.hypot(f,s),sp=sprint?9:5.5;
    const fx_=-Math.sin(yaw),fz_=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
    pl.x+=(fx_*f+rx*s)/l*sp*dt;pl.z+=(fz_*f+rz*s)/l*sp*dt;
    collide(pl,0.5);bobT+=dt*(sprint?14:10);
  }
  if(keys.Space&&py===0&&vy===0)vy=5.5;
  vy-=16*dt;py+=vy*dt;if(py<=0){py=0;vy=0}
  camera.position.set(pl.x,1.7+py+(moving&&py===0?Math.sin(bobT)*0.05:0),pl.z);
  camera.rotation.y=yaw;camera.rotation.x=pitch;

  spawnT+=dt;while(spawnT>=1){spawnT-=1;spawn()}
  let hits=0;
  for(let i=zs.length-1;i>=0;i--){
    const z=zs[i],dx=pl.x-z.x,dz=pl.z-z.z,d=Math.hypot(dx,dz)||0.001;
    z.yaw=Math.atan2(-dx,-dz);
    if(d>0.75){
      const wob=Math.sin(t*1.7+z.ph*3)*0.6,ux=dx/d,uz=dz/d;
      const vx=ux-uz*wob,vz=uz+ux*wob,vl=Math.hypot(vx,vz);
      z.x+=vx/vl*z.spd*dt;z.z+=vz/vl*z.spd*dt;collide(z,0.4);
      z.ph+=dt*z.spd*2.2;
    }
    if(d<1.0&&py<0.9)hits++;
  }
  if(hits){hp-=hits*30*dt;hurt=Math.min(1,hurt+dt*4)}else{hurt=Math.max(0,hurt-dt*2)}
  t+=dt;
  drawZ();
  if(hp<=0)gameOver();
}

function gameOver(){
  running=false;over=true;hp=0;
  if(document.exitPointerLock)document.exitPointerLock();
  let best=0;try{best=+localStorage.getItem('zc_best')||0;if(t>best){best=t;localStorage.setItem('zc_best',String(t))}}catch(e){best=Math.max(best,t)}
  show('감염되었습니다','생존 시간 <b>'+fmt(t)+'</b> · 만난 좀비 <b>'+total+'마리</b><br>최고 기록 <b>'+fmt(best)+'</b>','다시 하기');
}
function show(title,msg,btn){$('ovt').textContent=title;$('ovm').innerHTML=msg;$('go').textContent=btn;$('ov').style.display='flex'}
function pause(){if(!running)return;running=false;show('일시정지','계속하려면 버튼을 누르세요. 생존 시간 <b>'+fmt(t)+'</b>','계속하기')}
function lock(){try{const p=cv.requestPointerLock();if(p&&p.catch)p.catch(()=>{})}catch(e){}}

$('go').onclick=()=>{
  if(over||!started)reset();
  started=true;over=false;running=true;$('ov').style.display='none';lock();
};
cv.addEventListener('click',()=>{if(running&&!locked)lock()});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cv;if(!locked&&running)pause()});
addEventListener('blur',pause);
addEventListener('mousedown',()=>drag=true);
addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{
  if(running&&(locked||drag)){yaw-=e.movementX*0.0022;pitch=Math.max(-1.45,Math.min(1.45,pitch-e.movementY*0.0022))}
});
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(running&&(e.code==='Space'||e.code.startsWith('Arrow')))e.preventDefault();
  if(e.code==='Escape'||e.code==='KeyP')pause();
});
addEventListener('keyup',e=>{keys[e.code]=false});

/* ---------- HUD / 미니맵 ---------- */
const mm=$('mm').getContext('2d');
let lastSec=-1;
function hud(){
  $('hp').style.width=Math.max(0,hp)+'%';$('sp').style.width=st+'%';
  const s=t|0;if(s!==lastSec){lastSec=s;$('tm').textContent=fmt(t)}
  $('zc').textContent='좀비 '+zs.length+'마리';
  $('vg').style.opacity=hurt*0.9;
  mm.clearRect(0,0,140,140);
  mm.save();mm.translate(70,70);mm.rotate(yaw);
  const ci=((pl.x-OX)/CELL)|0,cj=((pl.z-OZ)/CELL)|0;
  mm.fillStyle='#5b6573';
  for(let j=Math.max(0,cj-1);j<=Math.min(N-1,cj+1);j++)for(let i=Math.max(0,ci-1);i<=Math.min(N-1,ci+1);i++)
    for(const b of cells[j*N+i])mm.fillRect(b[0]-pl.x,b[1]-pl.z,b[2]-b[0],b[3]-b[1]);
  mm.fillStyle='#ff4a3a';
  for(const z of zs){const dx=z.x-pl.x,dz=z.z-pl.z;if(dx*dx+dz*dz<4900)mm.fillRect(dx-1.5,dz-1.5,3,3)}
  mm.restore();
  mm.fillStyle='#fff';mm.beginPath();mm.moveTo(70,62);mm.lineTo(75,76);mm.lineTo(65,76);mm.closePath();mm.fill();
}

let last=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min((now-last)/1000,0.05);last=now;
  if(running)update(dt);
  hud();renderer.render(scene,camera);
}
camera.position.set(0,1.7,0);
requestAnimationFrame(tick);
</script>
</body>
</html>
